<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متصفح حسن ستور | Hassan Web Browser</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 glass border border-cyan-500/50 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-cyan-400 text-lg"></i>
        <span id="toastMsg" class="text-sm font-semibold"></span>
    </div>

    <!-- Header -->
    <header class="glass sticky top-0 z-50 border-b border-slate-800 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="router('browser')">
                <div class="bg-cyan-500 text-slate-950 p-2.5 rounded-xl font-black text-xl shadow-lg shadow-cyan-500/50">
                    <i class="fa-solid fa-compass"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-cyan-400">متصفح حسن ستور</h1>
                    <p class="text-xs text-slate-400">Browser & APK Hub</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button id="adminNavBtn" onclick="router('admin')" class="hidden bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/50 text-amber-400 px-3 py-2 rounded-xl text-sm flex items-center gap-2 transition">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>لوحة الأدمن</span>
                </button>

                <div id="authArea">
                    <button onclick="openModal('authModal')" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 py-2 rounded-xl text-sm font-semibold transition">تسجيل الدخول</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col" id="mainContent"></main>

    <!-- Footer -->
    <footer class="glass border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        <p>متصفح حسن ستور © 2026 - جميع الحقوق محفوظة</p>
    </footer>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass max-w-md w-full p-6 rounded-3xl border border-slate-800 shadow-2xl relative">
            <button onclick="closeModal('authModal')" class="absolute top-4 left-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h2 class="text-lg font-bold mb-2 text-cyan-400 flex items-center gap-2">
                <i class="fa-solid fa-user-lock"></i> تسجيل الدخول
            </h2>
            <p class="text-xs text-slate-400 mb-4">أدخل بريد الأدمن (alaaraad990999@gmail.com) لفتح لوحة التحكم.</p>
            <form onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="authEmail" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">كلمة المرور</label>
                    <input type="password" id="authPass" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold p-2.5 rounded-xl transition shadow-lg shadow-cyan-500/20">تسجيل الدخول</button>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const ADMIN_EMAIL = "alaaraad990999@gmail.com";
        let db = JSON.parse(localStorage.getItem('hassanBrowser_db')) || {
            currentUser: JSON.parse(localStorage.getItem('hassanBrowser_user')) || null,
            storeApkData: null,
            apkName: "HassanStore.apk"
        };

        function saveDB() {
            localStorage.setItem('hassanBrowser_db', JSON.stringify(db));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        let currentRoute = 'browser';
        function router(route) {
            currentRoute = route;
            render();
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            db.currentUser = { email: email };
            localStorage.setItem('hassanBrowser_user', JSON.stringify(db.currentUser));
            saveDB();
            closeModal('authModal');
            render();
            showToast("تم تسجيل الدخول بنجاح!");
        }

        function logout() {
            db.currentUser = null;
            localStorage.removeItem('hassanBrowser_user');
            saveDB();
            router('browser');
            showToast("تم تسجيل الخروج بنجاح");
        }

        function handleStoreApkUpload(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    db.storeApkData = evt.target.result;
                    db.apkName = file.name;
                    saveDB();
                    render();
                    showToast("تم رفع ملف APK للمتجر بنجاح وإتاحته للتحميل!");
                };
                reader.readAsDataURL(file);
            }
        }

        function render() {
            const main = document.getElementById('mainContent');
            const authArea = document.getElementById('authArea');
            const adminNavBtn = document.getElementById('adminNavBtn');

            const isAdmin = db.currentUser && db.currentUser.email === ADMIN_EMAIL;

            if (isAdmin) {
                adminNavBtn.classList.remove('hidden');
            } else {
                adminNavBtn.classList.add('hidden');
                if(currentRoute === 'admin') currentRoute = 'browser';
            }

            if (db.currentUser) {
                authArea.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-cyan-400 font-semibold hidden sm:inline">${db.currentUser.email}</span>
                        <button onclick="logout()" class="bg-red-500/15 hover:bg-red-500/25 text-red-400 border border-red-500/30 px-3 py-2 rounded-xl text-sm transition">خروج</button>
                    </div>
                `;
            } else {
                authArea.innerHTML = `
                    <button onclick="openModal('authModal')" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 py-2 rounded-xl text-sm font-semibold transition">تسجيل الدخول</button>
                `;
            }

            if (currentRoute === 'browser') {
                main.innerHTML = `
                    <div class="flex flex-col gap-4 flex-1">
                        <!-- Address Bar & Download Button -->
                        <div class="glass p-4 rounded-3xl border border-cyan-500/30 shadow-xl flex flex-col gap-3">
                            <div class="flex items-center gap-2">
                                <button onclick="browserBack()" class="bg-slate-900 hover:bg-slate-800 text-slate-300 p-2.5 rounded-xl border border-slate-700 transition"><i class="fa-solid fa-arrow-right"></i></button>
                                <button onclick="browserForward()" class="bg-slate-900 hover:bg-slate-800 text-slate-300 p-2.5 rounded-xl border border-slate-700 transition"><i class="fa-solid fa-arrow-left"></i></button>
                                <button onclick="browserReload()" class="bg-slate-900 hover:bg-slate-800 text-slate-300 p-2.5 rounded-xl border border-slate-700 transition"><i class="fa-solid fa-rotate-right"></i></button>
                                
                                <div class="flex-1 flex items-center relative">
                                    <i class="fa-solid fa-globe absolute right-3.5 text-slate-400"></i>
                                    <input type="text" id="urlInput" placeholder="اكتب رابط الموقع هنا..." 
                                        class="w-full bg-slate-900 border border-slate-700 rounded-2xl py-2.5 pr-10 pl-4 text-sm focus:outline-none focus:border-cyan-500 transition"
                                        onkeypress="if(event.key === 'Enter') navigateBrowser()">
                                </div>
                                
                                <button onclick="navigateBrowser()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-5 py-2.5 rounded-2xl text-sm transition shadow-lg shadow-cyan-500/20">
                                    انتقال
                                </button>
                            </div>

                            <div class="flex items-center justify-between flex-wrap gap-2 text-xs">
                                <div class="flex items-center gap-2 overflow-x-auto pb-1">
                                    <span class="text-slate-400 font-semibold ml-1">مواقع سريعة:</span>
                                    <button onclick="quickNav('https://www.google.com')" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl transition">جوجل</button>
                                    <button onclick="quickNav('https://bing.com')" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl transition">بينج</button>
                                    <button onclick="quickNav('https://wikipedia.org')" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl transition">ويكيبيديا</button>
                                </div>

                                <!-- زر تحميل ملف APK للمتجر (يظهر فقط إذا قام الأدمن برفعه مسبقاً) -->
                                ${db.storeApkData ? `
                                    <a href="${db.storeApkData}" download="${db.apkName}" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-xl flex items-center gap-2 transition shadow-lg shadow-emerald-500/20">
                                        <i class="fa-solid fa-download"></i> تحميل APK المتجر
                                    </a>
                                ` : `
                                    <span class="text-slate-500 text-xs">لم يتم رفع ملف APK للمتجر بعد من قبل الأدمن</span>
                                `}
                            </div>
                        </div>

                        <!-- Browser Frame -->
                        <div class="flex-1 glass rounded-3xl overflow-hidden border border-slate-800 shadow-2xl min-h-[550px] flex flex-col relative">
                            <div id="browserLoading" class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center z-10">
                                <i class="fa-solid fa-spinner fa-spin text-cyan-400 text-4xl"></i>
                            </div>
                            <iframe id="browserFrame" src="https://www.google.com" class="w-full flex-1 border-0 bg-white min-h-[550px]"></iframe>
                        </div>
                    </div>
                `;
            } else if (currentRoute === 'admin' && isAdmin) {
                main.innerHTML = `
                    <div class="max-w-xl mx-auto w-full glass p-8 rounded-3xl border border-amber-500/40 shadow-2xl space-y-6">
                        <div class="flex items-center justify-between">
                            <h2 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                                <i class="fa-solid fa-shield-halved"></i> لوحة الأدمن - رفع ملف APK المتجر
                            </h2>
                            <button onclick="router('browser')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs transition">العودة للمتصفح</button>
                        </div>
                        <p class="text-xs text-slate-400">اختر ملف الـ APK الخاص بالمتجر من جهازك لكي يتم حفظه وإتاحته مباشرة للزوار ليقوموا بتحميله.</p>
                        
                        <div class="glass p-6 rounded-2xl border border-slate-700 text-center space-y-4">
                            <div class="w-16 h-16 bg-amber-500/10 text-amber-400 rounded-2xl mx-auto flex items-center justify-center text-2xl">
                                <i class="fa-solid fa-file-arrow-up"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-sm text-slate-200">الملف الحالي: ${db.apkName}</h3>
                            </div>
                            <label class="block w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 px-4 rounded-xl cursor-pointer transition text-sm shadow-lg shadow-amber-500/20">
                                <i class="fa-solid fa-folder-open ml-2"></i> اختيار ملف APK من الجهاز
                                <input type="file" accept=".apk" class="hidden" onchange="handleStoreApkUpload(event)">
                            </label>
                        </div>
                    </div>
                `;
            }
        }

        function navigateBrowser() {
            let url = document.getElementById('urlInput').value.trim();
            if(!url) return;
            if(!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
                document.getElementById('urlInput').value = url;
            }
            document.getElementById('browserLoading').classList.remove('hidden');
            const frame = document.getElementById('browserFrame');
            frame.src = url;
            frame.onload = function() {
                document.getElementById('browserLoading').classList.add('hidden');
            };
        }

        function quickNav(url) {
            document.getElementById('urlInput').value = url;
            navigateBrowser();
        }

        function browserReload() {
            const frame = document.getElementById('browserFrame');
            frame.src = frame.src;
        }

        function browserBack() {
            try { document.getElementById('browserFrame').contentWindow.history.back(); } catch(e) {}
        }

        function browserForward() {
            try { document.getElementById('browserFrame').contentWindow.history.forward(); } catch(e) {}
        }

        render();
    </script>
</body>
        </html>
